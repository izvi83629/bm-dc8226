<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Profile Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111827;
      display: flex;
      justify-content: center;
      padding: 18px 14px 44px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 430px;
      background-color: #ffffff;
    }

    .org-header {
      margin-bottom: 18px;
      padding-top: 4px;
    }

    .status-banner-wrap {
      display: inline-block;
      max-width: 100%;
    }

    .paste-banner {
      background-color: #b8f2f2;
      padding: 10px 14px;
      display: inline-block;
    }

    .paste-banner h1 {
      color: #0f766e;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }

    .admin-approve-text {
      color: #dc2626;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
      margin-top: 6px;
    }

    .section-title {
      font-size: 29px;
      font-weight: 700;
      color: #111827;
      line-height: 1.12;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .profile-card {
      background-color: #f4f5f7;
      padding: 24px 16px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }

    .photo-box {
      width: 156px;
      height: 186px;
      background-color: #d1d5db;
      border: 1px solid #c5cad2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .qr-box {
      width: 172px;
      height: 172px;
      background-color: #ffffff;
      padding: 8px;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .badge-caption {
      font-size: 13.5px;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .badge-pill {
      background-color: #28a745;
      color: #ffffff;
      font-size: 21px;
      font-weight: 700;
      padding: 8px 38px;
      border-radius: 999px;
      margin-bottom: 18px;
      letter-spacing: 0.4px;
    }

    .member-name {
      font-size: 21px;
      font-weight: 800;
      text-transform: uppercase;
      color: #111827;
      line-height: 1.25;
      letter-spacing: 0.4px;
    }

    .top-meta-section {
      text-align: center;
      padding: 0 12px;
      margin-bottom: 22px;
    }

    .top-meta-block {
      margin-bottom: 18px;
    }

    .top-meta-label {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 3px;
    }

    .top-meta-value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    .top-meta-value.year {
      color: #1677b3;
    }

    .top-meta-value.valid {
      color: #28a745;
    }

    .top-meta-value.portable {
      color: #111827;
    }

    .details-section {
      text-align: left;
      padding: 0 16px;
    }

    .detail-block {
      margin-bottom: 20px;
    }

    .detail-label {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 3px;
    }

    .detail-value {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      line-height: 1.3;
      word-break: break-word;
    }

    .detail-value.status-active {
      color: #28a745;
    }

    .footer-meta {
      margin-top: 26px;
      padding: 0 16px;
      font-size: 13px;
      color: #4b5563;
      text-align: left;
      line-height: 1.5;
    }

    .footer-actions {
      margin-top: 8px;
      font-size: 13.5px;
      color: #2563eb;
    }

    .footer-actions a {
      color: #2563eb;
      text-decoration: none;
      margin-right: 10px;
    }
  </style>
</head>
<body id="top">
  <main class="page-wrapper">
    <header class="org-header">
      <div class="status-banner-wrap">
        <div class="paste-banner">
          <h1 id="paymentText">Payment Complete</h1>
        </div>
        <div class="admin-approve-text" id="adminText">Need Admin Approve</div>
      </div>
    </header>

    <h2 class="section-title" id="sectionTitle">Registered Member
Profile</h2>

    <section class="profile-card">
      <div class="photo-box" id="photo1Box">Photo 1</div>
      <div class="photo-box" id="photo2Box">Photo 2</div>

      <div class="qr-box" id="qrBox"></div>

      <div class="badge-caption" id="badgeCaption">Member ID Number</div>
      <div class="badge-pill" id="badgePill">D-13005</div>

      <div class="member-name" id="memberName">SAYIM HOSSEN ASIF</div>
    </section>

    <section class="top-meta-section" id="topMetaSection"></section>

    <section class="details-section" id="detailsSection"></section>

    <footer class="footer-meta">
      <div id="generatedText">Generated on: 25/11/2026 11:28 AM</div>
      <div class="footer-actions">
        <a href="#top">Back to Top</a> · <a href="#" onclick="window.print(); return false;">Print Page</a>
      </div>
    </footer>
  </main>

  <script>
    const profileData = {
      paymentText: "Payment Complete",
      adminText: "Need Admin Approve",
      sectionTitle: "Registered Member\nProfile",
      photo1: "photo1.jpg?v=2",
      photo2: "photo1.jpg?v=2",
      qrCode: "",
      badgeCaption: "Member ID Number",
      badgePill: "D-13005",
      memberName: "SAYIM HOSSEN ASIF",
      generatedOn: "Generated on: 25/11/2026 11:28 AM",
      topMeta: [
        { label: "Reg. Year", value: "2025", cls: "year" },
        { label: "Reg. Valid Till", value: "05/2035", cls: "valid" },
        { label: "Portable Card No", value: "Not Applicable", cls: "portable" }
      ],
      details: [
        { label: "Date of Birth", value: "**/**/2001", cls: "" },
        { label: "Blood Group", value: "A+", cls: "" },
        { label: "Father's Name", value: "SURUJ JAMAN", cls: "" },
        { label: "Mother's Name", value: "JURNA BEGUM", cls: "" },
        { label: "Address", value: "VILL.- SHORALIABARI P.O SREEPUR ,  P,S GAZIPUR ,  DISTRICT , GAZIPUR", cls: "" },
        { label: "Status", value: "Active", cls: "status-active" }
      ]
    };

    document.getElementById("paymentText").textContent = profileData.paymentText;
    document.getElementById("adminText").textContent = profileData.adminText;
    document.getElementById("sectionTitle").textContent = profileData.sectionTitle;

    function renderImage(id, src, fallback) {
      const el = document.getElementById(id);
      if (src && src.trim() !== "") {
        el.innerHTML = `<img src="${src}" alt="${fallback}" />`;
      } else {
        el.textContent = fallback;
      }
    }

    renderImage("photo1Box", profileData.photo1, "Photo 1");
    renderImage("photo2Box", profileData.photo2, "Photo 2");

    const qrEl = document.getElementById("qrBox");
    if (profileData.qrCode && profileData.qrCode.trim() !== "") {
      qrEl.innerHTML = `<img src="${profileData.qrCode}" alt="QR Code" />`;
    } else {
      qrEl.innerHTML = `<span style="font-size:12px;color:#6b7280;">QR Code</span>`;
    }

    document.getElementById("badgeCaption").textContent = profileData.badgeCaption;
    document.getElementById("badgePill").textContent = profileData.badgePill;
    document.getElementById("memberName").textContent = profileData.memberName;
    document.getElementById("generatedText").textContent = profileData.generatedOn;

    document.getElementById("topMetaSection").innerHTML = profileData.topMeta
      .map(item => `
        <div class="top-meta-block">
          <div class="top-meta-label">${item.label}</div>
          <div class="top-meta-value ${item.cls}">${item.value}</div>
        </div>
      `)
      .join("");

    document.getElementById("detailsSection").innerHTML = profileData.details
      .map(item => `
        <div class="detail-block">
          <div class="detail-label">${item.label}</div>
          <div class="detail-value ${item.cls}">${item.value}</div>
        </div>
      `)
      .join("");
  </script>
</body>
</html>
