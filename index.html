<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Verification Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      display: flex;
      justify-content: center;
      padding: 20px 14px 40px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 440px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 20px 18px 28px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    /* Header Layout */
    .org-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .org-seal {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2.5px solid #c93b3b;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #c93b3b;
      font-weight: 800;
      font-size: 11px;
      line-height: 1.15;
      padding: 6px;
      flex-shrink: 0;
      background-color: #ffffff;
    }

    .org-brand h1 {
      color: #c93b3b;
      font-size: 38px;
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.5px;
    }

    .org-brand p {
      color: #b83333;
      font-size: 12.5px;
      line-height: 1.25;
      margin-top: 5px;
      white-space: pre-line;
    }

    .page-heading {
      font-size: 28px;
      font-weight: 700;
      color: #111827;
      line-height: 1.15;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    /* Profile Card Container */
    .profile-card {
      background-color: #f4f5f7;
      border-radius: 6px;
      padding: 22px 16px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .photo-box {
      width: 155px;
      height: 185px;
      background-color: #d1d5db;
      border: 1px solid #c5cad2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .qr-box {
      width: 170px;
      height: 170px;
      background-color: #ffffff;
      padding: 8px;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .badge-label {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .badge-pill {
      background-color: #16a34a;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      padding: 8px 34px;
      border-radius: 999px;
      margin-bottom: 18px;
      letter-spacing: 0.4px;
    }

    .member-name {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      color: #111827;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
    }

    .details-list {
      width: 100%;
      font-size: 14px;
      line-height: 1.55;
      color: #1f2937;
    }

    .details-list p {
      margin-bottom: 6px;
      word-break: break-word;
    }

    .details-list strong {
      font-weight: 700;
      color: #111827;
    }
  </style>
</head>
<body>
  <main class="page-wrapper">
    <!-- Top Header -->
    <header class="org-header">
      <div class="org-seal" id="sealText">CUSTOM<br />SEAL</div>
      <div class="org-brand">
        <h1 id="brandTitle">YOURORG</h1>
        <p id="brandSubtitle">Custom Organization Subtitle Line 1
কাস্টম সাবটাইটেল দ্বিতীয় লাইন</p>
      </div>
    </header>

    <!-- Page Title -->
    <h2 class="page-heading" id="pageTitle">Registered Member
Profile</h2>

    <!-- Profile Card -->
    <section class="profile-card">
      <div class="photo-box" id="photo1Container">Photo 1</div>
      <div class="photo-box" id="photo2Container">Photo 2</div>

      <div class="qr-box" id="qrContainer">
        <!-- QR image goes here -->
      </div>

      <div class="badge-label" id="badgeLabel">Member ID Number</div>
      <div class="badge-pill" id="badgeValue">ID-10001</div>

      <div class="member-name" id="memberName">SAMPLE MEMBER NAME</div>

      <div class="details-list" id="detailsList"></div>
    </section>
  </main>

  <script>
    // এখানে আপনার নিজের কাস্টম তথ্য ও ছবির নাম/লিংক বসান
    const profileData = {
      sealText: "CUSTOM\nSEAL",
      brandTitle: "YOURORG",
      brandSubtitle: "Custom Organization Subtitle Line 1\nকাস্টম সাবটাইটেল দ্বিতীয় লাইন",
      pageTitle: "Registered Member\nProfile",
      photo1: "", // যেমন: "photo1.jpg" অথবা কোনো ছবির URL
      photo2: "", // যেমন: "photo2.jpg" অথবা কোনো ছবির URL
      qrCode: "", // যেমন: "qr.png" অথবা QR ছবির URL
      badgeLabel: "Member ID Number",
      badgeValue: "ID-10001",
      memberName: "SAMPLE MEMBER NAME",
      details: [
        { label: "Status", value: "Active" },
        { label: "Email", value: "member@example.com" },
        { label: "Phone", value: "+880 1XXX-XXXXXX" },
        { label: "Department", value: "General Member" },
        { label: "Issue Date", value: "01 Jan 2026" }
      ]
    };

    function renderPhoto(containerId, src, fallbackText) {
      const el = document.getElementById(containerId);
      if (src && src.trim() !== "") {
        el.innerHTML = `<img src="${src}" alt="${fallbackText}" />`;
      } else {
        el.textContent = fallbackText;
      }
    }

    document.getElementById("sealText").innerHTML = profileData.sealText.replace(/\n/g, "<br />");
    document.getElementById("brandTitle").textContent = profileData.brandTitle;
    document.getElementById("brandSubtitle").textContent = profileData.brandSubtitle;
    document.getElementById("pageTitle").textContent = profileData.pageTitle;

    renderPhoto("photo1Container", profileData.photo1, "Photo 1");
    renderPhoto("photo2Container", profileData.photo2, "Photo 2");

    const qrEl = document.getElementById("qrContainer");
    if (profileData.qrCode && profileData.qrCode.trim() !== "") {
      qrEl.innerHTML = `<img src="${profileData.qrCode}" alt="QR Code" />`;
    } else {
      qrEl.innerHTML = `<span style="font-size:12px;color:#6b7280;">QR Code Area</span>`;
    }

    document.getElementById("badgeLabel").textContent = profileData.badgeLabel;
    document.getElementById("badgeValue").textContent = profileData.badgeValue;
    document.getElementById("memberName").textContent = profileData.memberName;

    const detailsContainer = document.getElementById("detailsList");
    detailsContainer.innerHTML = profileData.details
      .map(item => `<p><strong>${item.label}:</strong> ${item.value}</p>`)
      .join("");
  </script>
</body>
</html>
